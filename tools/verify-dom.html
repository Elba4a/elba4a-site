<!doctype html><meta charset="utf-8"><title>phase-a probe</title>
<style>html,body{margin:0}iframe{border:0;display:block}pre{font:12px ui-monospace}</style>
<iframe id="f" src="/index.html" width="1280" height="900"></iframe>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (ok, name, detail = '') => {
  ok ? pass++ : fail++;
  out.append((ok ? 'OK   ' : 'FAIL ') + name + (detail ? ' :: ' + detail : '') + '\n');
};
const caught = d => out.append('CANARY-CAUGHT ' + d + '\n');

const f = document.getElementById('f');
const load = () => new Promise(r => f.addEventListener('load', r, { once: true }));
const settle = (ms = 120) => new Promise(r => setTimeout(r, ms));
const D = () => f.contentDocument, W = () => f.contentWindow;
const all = () => [...D().querySelectorAll('*')];
const cs = el => W().getComputedStyle(el);
const csp = (el, p) => W().getComputedStyle(el, p);

await load();

/* The page sets `scroll-behavior: smooth`, so every scrollTo below ANIMATES.
   Two snapshots taken 120ms apart during a 7,800px smooth scroll catch every
   element in a different place, and the diff reads as a layout shift that is
   not there — ten failures against a page whose geometry is provably
   identical. Measure against instant scrolling or the suite is flaky. */
D().documentElement.style.scrollBehavior = 'auto';

/* Let the hero's entrance animations land before anything is measured, or the
   first viewport catches the headline mid-rise and reports it as movement.
   Filtered to the document timeline on purpose: scroll-driven animations are
   never "finished", so awaiting those would hang here forever. */
await Promise.all(
  D().getAnimations()
    .filter((a) => a.timeline === D().timeline)
    .map((a) => a.finished.catch(() => {}))
);

/* ---- canaries: prove the detectors fire before any PASS is believable ---- */
{
  const c = D().createElement('div');
  /* block-size is load-bearing: a zero-height box contributes no scrollable
     overflow area, so a canary without it silently fails to arm. */
  c.style.cssText = 'opacity:.5;inline-size:120%;block-size:10px;position:relative';
  D().body.appendChild(c);
  if (+cs(c).opacity > .01 && +cs(c).opacity < .99) caught('opacity');
  const de = D().documentElement, prev = de.style.overflowX;
  de.style.overflowX = 'visible';
  if (de.scrollWidth > de.clientWidth) caught('overflow');
  de.style.overflowX = prev;
  c.remove();
  const a = D().querySelector('.hdr');
  const keep = a.style.position; a.style.position = 'static';
  if (cs(a).position !== 'sticky') caught('position');
  a.style.position = keep;

  /* Arm the header-control detector against the exact regression it exists
     for: hide the CTA the way the broken breakpoint did, and require the
     check to notice. */
  const cta = D().querySelector('.hdr__cta');
  const keepD = cta.style.display; cta.style.display = 'none';
  if (cs(cta).display === 'none' || cta.getBoundingClientRect().width === 0) caught('hidden-control');
  cta.style.display = keepD;
}

const VP = [[320,640],[360,780],[390,844],[430,900],[519,900],[521,900],[620,900],[621,900],[768,1024],[1280,900],[1920,1080]];

for (const [w, h] of VP) {
  f.width = w; f.height = h;
  W().scrollTo(0, 0);
  await settle(160);

  /* ---- 1. the frame: sticky header, hidden skip link, contained device ----
     This block used to toggle `.has-world` and assert the canvas moved
     nothing. There is no canvas: the WebGL layer was deleted along with the
     scene it drew. What survives is the pair of position assertions it was
     really protecting, which is where the (1,1,1) specificity accident landed
     the last time. */
  log(cs(D().querySelector('.hdr')).position === 'sticky', `.hdr sticky @${w}`,
      cs(D().querySelector('.hdr')).position);
  const sk = D().querySelector('.skip').getBoundingClientRect();
  log(sk.width <= 2 && sk.height <= 2, `.skip hidden until focused @${w}`, `${sk.width}x${sk.height}`);

  /* The device is the widest fixed-ish thing on the page and the likeliest
     source of an overflow, so assert it inside its own column rather than
     inferring it from the document width alone. */
  const phone = D().querySelector('.phone');
  const col = phone.parentElement.getBoundingClientRect();
  const pr = phone.getBoundingClientRect();
  log(pr.width > 0 && pr.left >= col.left - 1 && pr.right <= col.right + 1,
      `the device stays inside its column @${w}`,
      `${Math.round(pr.left)}..${Math.round(pr.right)} in ${Math.round(col.left)}..${Math.round(col.right)}`);

  /* Nine screens, one shown. A layout that stacked them would be legible but
     enormous, and nothing else on the page would say so. */
  const onScreens = [...D().querySelectorAll('.proto .screen')].filter(s => !s.hidden).length;
  log(onScreens === 1, `one screen shown at a time @${w}`, `${onScreens} visible`);

  /* Every tab has to be tappable, not merely present: the strip wraps, and a
     wrapped row that overflows its band is how a control goes missing. */
  const tabs = [...D().querySelectorAll('.proto [role="tab"]')];
  const small = tabs.filter(t => {
    const r = t.getBoundingClientRect();
    return r.width < 44 || r.height < 24;
  });
  log(small.length === 0, `every screen tab is a real target @${w}`,
      small.map(t => t.textContent).join(',') || `${tabs.length} tabs`);

  /* ---- 2. no horizontal overflow, clip lifted so it cannot mask it ------- */
  const de = D().documentElement, prev = de.style.overflowX;
  de.style.overflowX = 'visible';
  log(de.scrollWidth === de.clientWidth, `scrollWidth === clientWidth @${w}`,
      `${de.scrollWidth} vs ${de.clientWidth}`);
  de.style.overflowX = prev;

  /* ---- 3. every header control is reachable at every width --------------
     Not just the nav. The first attempt at this traded the CTA away to make
     room for the nav, which is how a button vanished on mobile. Any control
     that resolves to zero width is a failure regardless of which one it is. */
  for (const sel of ['.hdr__nav', '.hdr__cta', '.hdr__id']) {
    const el = D().querySelector(sel);
    const r = el.getBoundingClientRect();
    log(cs(el).display !== 'none' && r.width > 0 && r.height > 0,
        `${sel} reachable @${w}`, `${cs(el).display} ${Math.round(r.width)}x${Math.round(r.height)}`);
  }

  /* ---- 4. nothing at rest is half-faded --------------------------------- */
  W().scrollTo(0, D().body.scrollHeight); await settle(420);
  W().scrollTo(0, 0);                     await settle(220);
  W().scrollTo(0, D().body.scrollHeight); await settle(420);
  const half = all().filter(e => { const o = +cs(e).opacity; return o > .01 && o < .99; })
                    .map(e => (e.className || e.tagName) + '=' + (+cs(e).opacity).toFixed(4));
  log(half.length === 0, `nothing at rest in opacity (0.01,0.99) @${w}`, half.slice(0, 4).join(','));

  const stub = [...D().querySelectorAll('.s-head')].filter(s => {
    const t = csp(s, '::after').transform;
    if (!t || t === 'none') return false;
    const m = new DOMMatrixReadOnly(t);
    return m.a > 0.01 && m.a < 0.99;
  });
  log(stub.length === 0, `no section rule frozen part-drawn @${w}`, `${stub.length} stubs`);
  W().scrollTo(0, 0); await settle(120);
}

/* ---- 5. block alignment: .proj--alt must not hang left ------------------- */
for (const w of [1216, 1280, 1440, 1920]) {
  f.width = w; await settle(180);
  const plain = D().querySelector('.proj:not(.proj--alt) .proj__title h3').getBoundingClientRect().x;
  const alt   = D().querySelector('.proj--alt .proj__title h3').getBoundingClientRect().x;
  log(Math.abs(plain - alt) < 1, `.proj--alt aligns with .proj @${w}`, `${plain} vs ${alt}`);
}

/* ---- 6. hierarchy + the tabular-nums comma ------------------------------ */
f.width = 1280; await settle(180);
const h2 = parseFloat(cs(D().querySelector('.s-head h2')).fontSize);
const h3 = parseFloat(cs(D().querySelector('.proj__title h3')).fontSize);
log(h2 > h3, 'section h2 larger than project h3', `${h2} vs ${h3}`);

const capt = D().querySelector('.facts dd span');
log(cs(capt).fontVariantNumeric !== 'tabular-nums', 'caption is not tabular-nums',
    cs(capt).fontVariantNumeric);

/* ---- 7. every swatch chip is mounted so it reads on its card ------------ */
for (const i of D().querySelectorAll('.swatches i')) {
  const sh = cs(i).boxShadow;
  log(/245,\s*241,\s*233/.test(sh), 'swatch has an ivory mount', sh.slice(0, 44));
}

out.append(`HARNESS-END pass=${pass} fail=${fail}\n`);
</script>
