<!doctype html>
<!-- Source for assets/img/og.png. Not shipped — the Dockerfile copies explicit
     paths and tools/ is not one of them. Regenerate with the command in
     README.md after changing anything here.

     Render it over the local http server, not file://, so the @font-face files
     load; Chrome applies CORS to fonts and a file:// origin fails it, which
     silently falls back to a system face and quietly changes the card. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("/assets/fonts/schibsted-grotesk-latin.woff2") format("woff2");
    font-weight: 400 900;
  }
  @font-face {
    font-family: "Azeret Mono";
    src: url("/assets/fonts/azeret-mono-latin.woff2") format("woff2");
    font-weight: 400 600;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #FBFBF9;
    color: #16161A;
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
    padding: 74px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .top, .btm { position: relative; }
  .eyebrow {
    font-family: "Azeret Mono", ui-monospace, monospace;
    font-size: 17px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #5A5A63;
  }
  h1 {
    font-size: 96px;
    font-weight: 500;
    line-height: .98;
    letter-spacing: -.038em;
    margin-top: 30px;
    max-width: 13ch;
  }
  h1 em { font-style: normal; color: #1B44C8; }
  .rule { height: 1px; background: #E4E4DE; margin-bottom: 24px; }
  .btm { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
  .dom { font-size: 25px; font-weight: 500; letter-spacing: -.01em; }
  .stack {
    font-family: "Azeret Mono", ui-monospace, monospace;
    font-size: 16px;
    color: #5A5A63;
  }
</style>
</head>
<body>
  <div class="top">
    <p class="eyebrow">Islam Soliman · Software engineer · Cairo</p>
    <h1>I build every layer <em>myself</em>.</h1>
  </div>
  <div>
    <div class="rule"></div>
    <div class="btm">
      <span class="dom">elba4a.com</span>
      <span class="stack">React Native · Next.js · Supabase · Claude API</span>
    </div>
  </div>
</body>
</html>
